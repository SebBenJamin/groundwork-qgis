site_name: Groundwork
site_description: Geophysical profiles in QGIS
site_url: https://sebbenjamin.github.io/groundwork-qgis/
repo_url: https://github.com/SebBenJamin/groundwork-qgis
repo_name: groundwork-qgis
edit_uri: edit/master/docs/
docs_dir: docs
exclude_docs: |
  superpowers/
  decisions/
not_in_nav: |
  /releases/0.1*.md
  /releases/0.[2-9]*.md
  /releases/0.1[0-2]*.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search

markdown_extensions:
  - mdx_truly_sane_lists:     # lists nested by two spaces, as on GitHub
      nested_indent: 2
      truly_sane: true
  - tables
  - admonition
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - First steps: user/first-steps.md
  - How-tos:
      - Projects and profiles: user/howto/projects-and-profiles.md
      - Add data: user/howto/add-data.md
      - The section panel: user/howto/section-panel.md
      - Seismic refraction: user/howto/seismic-refraction.md
      - Placement on the electrodes: user/howto/placement.md
      - Reference height: user/howto/reference-height.md
      - Boreholes and logs: user/howto/boreholes.md
      - Geology, crossing lines and ties: user/howto/context.md
      - Interpretation: user/howto/interpretation.md
      - Field notes: user/howto/field-notes.md
      - Dataset info: user/howto/dataset-info.md
      - Report plates: user/howto/plates.md
      - The 3D view: user/howto/3d-view.md
  - Data formats:
      - Methods and formats: user/formats/overview.md
      - Borehole tables: user/formats/borehole-tables.md
      - Plate templates: user/formats/plate-templates.md
  - Troubleshooting: user/troubleshooting.md
  - What's new:
      - All releases: releases/index.md
      - 0.15.0: releases/0.15.0.md
      - 0.14.2: releases/0.14.2.md
      - 0.14.1: releases/0.14.1.md
      - 0.14.0: releases/0.14.0.md
      - 0.13.0: releases/0.13.0.md
